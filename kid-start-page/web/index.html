<!doctype html>
<html lang="en" data-theme="blocks">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My School Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Nunito:wght@700;800;900&family=Patrick+Hand&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 24px 32px; }

  /* Header HUD */
  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
  .hello { display: flex; align-items: center; gap: 16px; }
  .avatar { width: 72px; height: 72px; background: var(--accent); border: 4px solid #000; display: grid; place-items: center; font-size: 38px;
    box-shadow: inset 4px 4px 0 rgba(255,255,255,.45), inset -4px -4px 0 rgba(0,0,0,.35); }
  .hello h1 { margin: 0; font-family: var(--pixel); font-size: 22px; line-height: 1.5; color: #fff; text-shadow: 3px 3px 0 #000; }
  .hello p { margin: 4px 0 0; color: #fff; font-size: 26px; text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000; }
  .clock { text-align: right; color: #fff; text-shadow: 4px 4px 0 #000; }
  .clock .label { font-family: var(--pixel); font-size: 12px; letter-spacing: 2px; }
  .clock .time { font-family: var(--pixel); font-size: 46px; line-height: 1.2; margin-top: 6px; }
  .clock .time small { font-size: 18px; margin-left: 8px; }
  .clock .date { font-family: var(--pixel); font-size: 12px; margin-top: 8px; color: var(--gold); }

  /* Layout */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }
  .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } .clock { text-align: left; } }
  /* Phones: smaller header so the page starts sooner */
  @media (max-width: 600px) {
    .wrap { padding: 14px 14px 24px; }
    .avatar { width: 52px; height: 52px; font-size: 28px; }
    .hello h1 { font-size: 16px; }
    .hello p { font-size: 20px; }
    .clock .time { font-size: 34px; }
    .card { padding: 14px 14px; }
    .card h2 { font-size: 12px; }
    .demobar { font-size: 13px; }
  }
  .card h2 .count { margin-left: auto; font-size: 10px; color: #555; }
  .empty { color: #555; font-size: 24px; padding: 4px 0; }

  /* Tasks: inventory slots that turn into gold blocks when done */
  .xp { position: relative; height: 18px; background: #222; border: 3px solid #000; margin: -4px 0 14px; }
  .xp > div { height: 100%; background: var(--xp); box-shadow: inset 0 -4px 0 #4ca80f; transition: width .4s steps(8); }
  .xp span { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-family: var(--pixel); font-size: 12px; color: var(--xp); text-shadow: 2px 2px 0 #000, -2px -2px 0 #000; }
  .task { display: flex; align-items: center; gap: 14px; padding: 8px; cursor: pointer; user-select: none; }
  .task:hover { background: rgba(255,255,255,.35); }
  .box { width: 40px; height: 40px; flex: none; background: var(--panel-dark); display: grid; place-items: center;
    box-shadow: inset 3px 3px 0 #373737, inset -3px -3px 0 #fff; font-family: var(--pixel); font-size: 16px; color: #fff; }
  .task.done .box { background: var(--gold); border: 3px solid #000; box-shadow: inset 3px 3px 0 #ffe08a, inset -3px -3px 0 var(--gold-dark); text-shadow: 2px 2px 0 var(--gold-dark); animation: bump .25s; }
  @keyframes bump { 40% { transform: translateY(-10px); } }
  .task .t { font-size: 28px; line-height: 1; }
  .task .n { font-size: 20px; color: #555; }
  .task.done .t { text-decoration: line-through; color: #6b6b6b; }
  .allDone { text-align: center; font-family: var(--pixel); font-size: 13px; line-height: 1.6; color: #fff; text-shadow: 2px 2px 0 #000;
    padding: 14px; background: #3cb043; border: 3px solid #000; margin-top: 12px; }

  /* Today's events */
  .event { display: flex; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 3px dotted var(--panel-dark); }
  .event:last-child { border-bottom: 0; }
  .event .when { min-width: 110px; font-family: var(--pixel); font-size: 11px; color: var(--accent); }
  .event .t { font-size: 28px; line-height: 1; }
  .event .n { color: #555; font-size: 20px; }

  /* Reminders: wooden signs */
  .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .note { background: var(--plank); border: 3px solid #000; padding: 12px 14px; font-size: 24px; line-height: 1.05; color: #2b1d0e;
    background-image: repeating-linear-gradient(0deg, transparent 0 22px, var(--plank-dark) 22px 24px); }
  .note .n { font-size: 19px; color: #4a3417; margin-top: 4px; }

  /* Timer */
  .timer { text-align: center; }
  .timer svg { width: min(100%, 380px); height: auto; display: block; margin: 0 auto; }
  .timer .readout { font-family: var(--pixel); font-size: 34px; margin-top: 10px; }
  .timer .zone { font-family: var(--pixel); font-size: 11px; color: #555; min-height: 20px; margin-top: 10px; }
  .presets { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 16px 0 10px; }
  .btn.preset.active { background: #e45c10; box-shadow: inset 3px 3px 0 #ffa36c, inset -3px -4px 0 #8a3200; text-shadow: 2px 2px 0 #8a3200; }
  .controls { display: flex; gap: 10px; justify-content: center; }
  .btn.go { min-width: 140px; }
  .timer.finished .readout { color: #d83a2b; animation: blink .6s steps(1) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .timer.big { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: center; }
  .timer.big svg { width: min(72vh, 90vw); }

  /* Week: one block per day */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
  @media (max-width: 900px) { .week { grid-template-columns: repeat(2, 1fr); } }
  .day { background: #a0a0a0; border: 3px solid #000; padding: 10px; min-height: 130px; box-shadow: inset 3px 3px 0 #d0d0d0, inset -3px -3px 0 #6a6a6a; }
  .day.today { background: var(--gold); box-shadow: inset 3px 3px 0 #ffe08a, inset -3px -3px 0 var(--gold-dark); }
  .day h3 { margin: 0 0 8px; font-family: var(--pixel); font-size: 10px; line-height: 1.5; }
  .day h3 small { display: block; font-family: var(--body); font-size: 20px; color: #333; }
  .chip { font-size: 21px; line-height: 1; background: #fff; border: 2px solid #000; padding: 5px 7px; margin-bottom: 6px; border-left: 8px solid var(--accent); }
  .chip.task { border-left-color: #3cb043; }
  .chip.reminder { border-left-color: var(--plank); }
  .chip small { display: block; color: #555; font-size: 18px; }
  .chip { cursor: default; }
  .chip.done { text-decoration: line-through; opacity: .6; }
  .chip.done::before { content: "✓ "; }

  /* Player select */
  .picker { min-height: 85vh; display: grid; place-items: center; text-align: center; position: relative; z-index: 1; }
  .picker h1 { font-family: var(--pixel); font-size: 26px; line-height: 1.6; color: #fff; text-shadow: 4px 4px 0 #000; margin-bottom: 36px; }
  .picker .choices { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap; }
  .picker button { font-family: var(--pixel); font-size: 16px; border: 4px solid #000; cursor: pointer; padding: 28px 36px; color: #fff; text-shadow: 3px 3px 0 #000;
    box-shadow: inset 5px 5px 0 rgba(255,255,255,.4), inset -5px -5px 0 rgba(0,0,0,.35), 6px 6px 0 rgba(0,0,0,.3); }
  .picker button:hover { transform: translateY(-6px); }
  .picker .parentbtn { display: inline-block; margin-top: 36px; text-decoration: none; }
  .picker button span { display: block; font-size: 60px; margin-bottom: 14px; text-shadow: none; }
  /* Links inside tasks, events and reminders */
  a.link { display: inline-block; font-family: var(--pixel); font-size: 10px; color: #fff; background: #1d4ed8; border: 2px solid #000; padding: 5px 8px; margin: 4px 0; text-decoration: none; text-shadow: 1px 1px 0 #000; }
  a.link:hover { background: #2563eb; }
  html[data-theme="jump"] a.link { border-radius: 8px; }
  .zoneWide { display: flex; flex-direction: column; gap: 22px; margin-top: 22px; }
  .grid.one { grid-template-columns: 1fr; }
  .stash { display: none; }

  /* Verse of the week */
  .verse blockquote { margin: 0; font-size: 28px; line-height: 1.15; }
  .verse .ref { margin-top: 12px; font-family: var(--pixel); font-size: 11px; color: var(--accent); text-align: right; }
  html[data-theme="jump"] .verse blockquote { font-size: 22px; line-height: 1.35; }

  /* Doodle pad */
  .doodle canvas { width: 100%; height: auto; display: block; background: #fff; border: 4px solid #000; touch-action: none; cursor: crosshair; }
  html[data-theme="jump"] .doodle canvas { border-radius: 12px; }
  .dtools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 12px; }
  .dtools .grp { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .dtools.stamps { margin-top: 8px; }
  .dtools.stamps .tool { font-size: 20px; min-width: 40px; }
  .sw { width: 32px; height: 32px; border: 3px solid #000; cursor: pointer; padding: 0; }
  .sw.on, .tool.on { outline: 4px solid #fff; outline-offset: -1px; box-shadow: 0 0 0 7px #000; }
  .sw.rainbow { background: linear-gradient(135deg, #ef4444, #f97316, #eab308, #22c55e, #3b82f6, #a855f7); }
  .tool { min-width: 40px; height: 40px; border: 3px solid #000; background: #eee; cursor: pointer; font-size: 18px; display: grid; place-items: center; padding: 0 6px; }
  .tool .dot { background: #000; border-radius: 50%; }
  html[data-theme="jump"] .sw, html[data-theme="jump"] .tool { border-radius: 8px; }

  /* Doodle pad or zen garden */
  .playswitch { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .playswitch .btn:not(.on) { opacity: .5; }
  .zenbox { position: relative; }
  .doodle .zenbox canvas.rocks { position: absolute; left: 0; top: 0; pointer-events: none; background: transparent; border-color: transparent; box-shadow: none; }
  .doodle .zenbox canvas.sand { cursor: grab; }
  .tool.rake { width: 48px; height: 44px; color: #5b4630; }
  html[data-theme="blueprint"] .tool.rake { color: var(--bp-ink); }
  html[data-theme="rainbow"] .tool.rake { color: #7c3aed; }

  /* Kids Today: grown-ups see how everyone is doing */
  .kidrow { margin-bottom: 14px; }
  .kidrow:last-child { margin-bottom: 0; }
  .kidrow .top { display: flex; align-items: center; gap: 8px; font-size: 24px; }
  .kidrow .top .of { margin-left: auto; font-size: 19px; color: #555; }
  .minibar { height: 10px; background: rgba(0,0,0,.15); border-radius: 99px; overflow: hidden; margin: 6px 0; }
  .minibar > div { height: 100%; border-radius: 99px; transition: width .4s; }
  .kt { font-size: 20px; color: #555; }
  .kt.yes { color: #1f6b24; text-decoration: line-through; }

  .switch { color: #fff; text-shadow: 2px 2px 0 #000; font-size: 20px; text-align: center; margin-top: 24px; position: relative; z-index: 1; }
  .switch a { color: inherit; }
</style>

<script src="common.js?v=5"></script>
<script src="demo.js?v=5"></script>
<script>
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
let kidId = params.has("pick") ? null : params.get("kid") || safeGet("kid");
let data = null;
let lastDate = ymd(new Date());

function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

/* ---------- Data ---------- */
async function refresh() {
  try {
    data = await api("/api/data");
    render();
  } catch (e) {
    if (!data) app.innerHTML = `<div class="picker"><div><h1>Can't reach the start page 😕</h1><p>Make sure the home computer is on, then refresh.</p></div></div>`;
  }
}

function me() { return data?.settings.kids.find((s) => s.id === kidId); }

/* ---------- Render ---------- */
function render() {
  const kid = me();
  if (!kid) return renderPicker();
  document.documentElement.style.setProperty("--accent", kid.color);
  document.documentElement.style.setProperty("--accent-soft", kid.color + "22");
  document.title = `${kid.name}'s School Day`;

  if (!document.getElementById("main")) buildShell();
  applyTheme();
  applyPlay();
  document.getElementById("avatar").textContent = kid.emoji || "🙂";
  document.getElementById("helloName").textContent = `${greeting()}, ${kid.name}!`;
  placeWidgets();
  renderKidsToday();
  renderVerse();
  renderToday();
  renderWeek();
}

// Each kid's look is remembered on their own computer.
function applyTheme() {
  const saved = safeGet("theme-" + kidId);
  const t = ["jump", "blueprint", "rainbow"].includes(saved) ? saved : "blocks";
  document.documentElement.dataset.theme = t;
  document.querySelectorAll(".themes button").forEach((b) => b.classList.toggle("on", b.dataset.theme === t));
}

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
}

function renderPicker() {
  const s = data.settings.kids;
  app.innerHTML = `<div class="picker"><div>
    <h1>Choose your player</h1>
    <div class="choices">${s.map((k) => `<button style="background:${esc(k.color)}" data-id="${esc(k.id)}"><span>${esc(k.emoji)}</span>${esc(k.name)}</button>`).join("")}</div>
    <a class="btn parentbtn" href="edit.html">🔒 Edit page</a>
  </div></div>`;
  app.querySelectorAll("button").forEach((b) => b.onclick = () => {
    kidId = b.dataset.id; safeSet("kid", kidId);
    history.replaceState(null, "", "?kid=" + kidId);
    app.innerHTML = ""; render();
  });
}

function buildShell() {
  app.innerHTML = `
  <div class="wrap" id="main">
    <header>
      <div class="hello"><div class="avatar" id="avatar"></div>
        <div><h1 id="helloName"></h1><p id="subhead"></p></div></div>
      <div class="clock"><div class="label">TIME</div><div class="time" id="clockTime"></div><div class="date" id="clockDate"></div>
        <div class="themes"><button data-theme="blocks">⛏️ BLOCK WORLD</button><button data-theme="jump">🍄 JUMP WORLD</button><button data-theme="blueprint">📐 BLUEPRINT</button><button data-theme="rainbow">🌈 RAINBOW CODE</button></div></div>
    </header>
    <div class="grid" id="grid"><div class="col" id="zone-left"></div><div class="col" id="zone-right"></div></div>
    <div class="zoneWide" id="zone-wide"></div>
    <div class="stash" id="zone-hidden">
      <section class="card" data-w="kids" id="kidsCard"><h2>👀 Kids Today</h2><div id="kidsToday"></div></section>
      <section class="card verse" data-w="verse"><h2>📖 Verse of the Week</h2><blockquote id="verseText"></blockquote><div class="ref" id="verseRef"></div></section>
      <section class="card" data-w="tasks"><h2>✅ Today's Tasks <span class="count" id="taskCount"></span></h2><div id="tasks"></div></section>
      <section class="card" data-w="events"><h2>📅 Happening Today</h2><div id="events"></div></section>
      <section class="card" data-w="reminders" id="remindersCard"><h2>📌 Reminders</h2><div class="notes" id="reminders"></div></section>
      <section class="card timer" data-w="timer" id="timer"></section>
      <section class="card doodle" data-w="doodle" id="doodle">
        <div class="playswitch"><button class="btn small" data-play="doodle">🎨 DOODLE PAD</button><button class="btn small" data-play="zen">🪨 ZEN GARDEN</button></div>
        <div id="doodlePane"></div><div id="zenPane"></div></section>
      <section class="card" data-w="week"><h2>🗓️ This Week</h2><div class="week" id="week"></div></section>
    </div>
    <div class="switch">Not you? <a href="#" id="switchKid">Switch player</a> · <a href="edit.html">Edit page</a></div>
  </div>`;
  document.getElementById("switchKid").onclick = (e) => {
    e.preventDefault(); kidId = null; safeSet("kid", ""); history.replaceState(null, "", location.pathname); render();
  };
  document.querySelectorAll(".themes button").forEach((b) => b.onclick = () => { safeSet("theme-" + kidId, b.dataset.theme); applyTheme(); });
  tickClock();
  Timer.mount(document.getElementById("timer"));
  Doodle.mount(document.getElementById("doodlePane"));
  Zen.mount(document.getElementById("zenPane"));
  document.querySelectorAll("[data-play]").forEach((b) => b.onclick = () => { safeSet("play-" + kidId, b.dataset.play); applyPlay(); });
}

// Each player picks the doodle pad or the zen garden, remembered on their computer.
function applyPlay() {
  const p = safeGet("play-" + kidId) === "zen" ? "zen" : "doodle";
  document.getElementById("doodlePane").style.display = p === "doodle" ? "" : "none";
  document.getElementById("zenPane").style.display = p === "zen" ? "" : "none";
  document.querySelectorAll("[data-play]").forEach((b) => b.classList.toggle("on", b.dataset.play === p));
}

// Grown-ups get a snapshot of every kid's tasks for today.
function renderKidsToday() {
  const card = document.getElementById("kidsCard");
  const kids = data.settings.kids.filter((k) => !k.grownup);
  if (!me().grownup || !kids.length) { card.style.display = "none"; return; }
  card.style.display = "";
  const today = new Date(), key = ymd(today);
  document.getElementById("kidsToday").innerHTML = kids.map((k) => {
    const tasks = data.items.filter((i) => i.type === "task" && happensOn(i, today, k.id)).sort(byTime);
    const done = tasks.filter((t) => data.done[`${key}|${t.id}|${k.id}`]).length;
    return `<div class="kidrow"><div class="top">${esc(k.emoji)} ${esc(k.name)}<span class="of">${tasks.length ? `${done} of ${tasks.length} done${done === tasks.length ? " 🎉" : ""}` : "No tasks today"}</span></div>
      ${tasks.length ? `<div class="minibar"><div style="width:${(done / tasks.length) * 100}%;background:${esc(k.color)}"></div></div>` : ""}
      ${tasks.map((t) => { const yes = data.done[`${key}|${t.id}|${k.id}`]; return `<div class="kt ${yes ? "yes" : ""}">${yes ? "✓" : "☐"} ${esc(t.title)}</div>`; }).join("")}</div>`;
  }).join("");
}

// Moves each widget box into the area the parent picked. Moving (not rebuilding) keeps the timer and drawing intact.
let placedLayout = "";
function placeWidgets() {
  const layout = normalizeLayout(data.settings.layout);
  const sig = JSON.stringify(layout);
  if (sig === placedLayout) return;
  placedLayout = sig;
  for (const z of ZONES_ORDER) {
    const zone = document.getElementById("zone-" + z);
    for (const w of layout[z]) zone.appendChild(document.querySelector(`[data-w="${w}"]`));
  }
  const grid = document.getElementById("grid");
  grid.classList.toggle("one", !layout.left.length || !layout.right.length);
  grid.style.display = layout.left.length || layout.right.length ? "" : "none";
}

function renderVerse() {
  const v = verseOfWeek(data.verses);
  document.getElementById("verseText").textContent = v ? v.text : "Add verses to 52.bible.verses.txt to show one here each week.";
  document.getElementById("verseRef").textContent = v ? `— ${v.ref}` : "";
}

function itemsOn(date, type) {
  return data.items.filter((i) => i.type === type && happensOn(i, date, kidId)).sort(byTime);
}

function renderToday() {
  const today = new Date();
  const key = ymd(today);
  const tasks = itemsOn(today, "task");
  const doneCount = tasks.filter((t) => data.done[`${key}|${t.id}|${kidId}`]).length;

  document.getElementById("taskCount").textContent = tasks.length ? `${doneCount} of ${tasks.length} done` : "";
  document.getElementById("tasks").innerHTML = tasks.length ? `
    <div class="xp"><span>${doneCount}</span><div style="width:${(doneCount / tasks.length) * 100}%"></div></div>
    ${tasks.map((t) => {
      const done = data.done[`${key}|${t.id}|${kidId}`];
      return `<div class="task ${done ? "done" : ""}" data-id="${esc(t.id)}">
        <div class="box">${done ? "★" : ""}</div>
        <div><div class="t">${esc(t.title)}</div>${t.time || t.note ? `<div class="n">${linkify([fmtTime(t.time), t.note].filter(Boolean).join(" · "))}</div>` : ""}</div>
      </div>`;
    }).join("")}
    ${doneCount === tasks.length ? `<div class="allDone">★ LEVEL COMPLETE! ★<br>All tasks done today!</div>` : ""}`
    : `<div class="empty">No tasks today. Enjoy! 🌈</div>`;
  document.querySelectorAll(".task").forEach((el) => el.onclick = (e) => { if (!e.target.closest("a")) toggleTask(el.dataset.id); });

  const sub = tasks.length - doneCount;
  document.getElementById("subhead").textContent = sub ? `You have ${sub} task${sub === 1 ? "" : "s"} left today.` : tasks.length ? "Everything's checked off!" : "";

  const events = itemsOn(today, "event");
  document.getElementById("events").innerHTML = events.length ? events.map((e) => `
    <div class="event"><div class="when">${e.time ? fmtTime(e.time) : "Today"}</div>
      <div><div class="t">${esc(e.title)}</div>${e.note ? `<div class="n">${linkify(e.note)}</div>` : ""}</div></div>`).join("")
    : `<div class="empty">Nothing special today.</div>`;

  const reminders = itemsOn(today, "reminder");
  document.getElementById("remindersCard").style.display = reminders.length ? "" : "none";
  document.getElementById("reminders").innerHTML = reminders.map((r) => `
    <div class="note">${esc(r.title)}${r.note || r.time ? `<div class="n">${linkify([fmtTime(r.time), r.note].filter(Boolean).join(" · "))}</div>` : ""}</div>`).join("");
}

async function toggleTask(id) {
  const k = `${ymd(new Date())}|${id}|${kidId}`;
  const done = !data.done[k];
  if (done) { data.done[k] = true; coin(); } else delete data.done[k];
  renderToday();
  renderWeek();
  try { await api("/api/done", { date: ymd(new Date()), item: id, kid: kidId, done }); } catch { refresh(); }
}

// Tiles used to be reorderable; clear any order a kid's computer saved back then.
try { Object.keys(localStorage).filter((k) => k.startsWith("weekorder-")).forEach((k) => localStorage.removeItem(k)); } catch {}

function renderWeek() {
  const start = new Date();
  let html = "";
  for (let i = 0; i < 7; i++) {
    const d = addDays(start, i), key = ymd(d);
    // Everyday items would repeat in every column, so the week view leaves them out.
    const items = data.items
      .filter((it) => it.when?.kind !== "daily" && happensOn(it, d, kidId))
      .sort((a, b) => (a.type === "event" ? 0 : 1) - (b.type === "event" ? 0 : 1) || byTime(a, b));
    html += `<div class="day ${i === 0 ? "today" : ""}">
      <h3>${i === 0 ? "Today" : i === 1 ? "Tomorrow" : DAY_NAMES[d.getDay()]}<small>${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</small></h3>
      ${items.map((it) => `<div class="chip ${it.type} ${it.type === "task" && data.done[`${key}|${it.id}|${kidId}`] ? "done" : ""}">${esc(it.title)}${it.time ? `<small>${fmtTime(it.time)}</small>` : ""}</div>`).join("")}
    </div>`;
  }
  document.getElementById("week").innerHTML = html;
}

/* ---------- Clock ---------- */
function tickClock() {
  const now = new Date();
  const t = document.getElementById("clockTime");
  if (t) {
    const h = ((now.getHours() + 11) % 12) + 1;
    t.innerHTML = `${h}:${String(now.getMinutes()).padStart(2, "0")}<small>${now.getHours() >= 12 ? "PM" : "AM"}</small>`;
    document.getElementById("clockDate").textContent = now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }
  if (ymd(now) !== lastDate) { lastDate = ymd(now); refresh(); }
}
setInterval(tickClock, 1000);

/* ---------- Visual timer ---------- */
// Each 10 minutes of remaining time gets its own color, so kids can see "I'm in the yellow".
const ZONES = [
  { color: "#ef4444", name: "red" },     // 0-10 min left
  { color: "#f97316", name: "orange" },  // 10-20
  { color: "#eab308", name: "yellow" },  // 20-30
  { color: "#22c55e", name: "green" },   // 30-40
  { color: "#3b82f6", name: "blue" },    // 40-50
  { color: "#a855f7", name: "purple" },  // 50-60
];
const PRESETS = [15, 25, 30, 45];

const Timer = {
  el: null,
  state: null, // { total (sec), endAt (ms) | null, left (sec, when paused) }

  key() { return "timer-" + kidId; },
  load() {
    try { this.state = JSON.parse(localStorage.getItem(this.key())); } catch {}
    if (!this.state) this.state = { total: 25 * 60, endAt: null, left: 25 * 60 };
  },
  save() { safeSet(this.key(), JSON.stringify(this.state)); },

  remaining() {
    const s = this.state;
    return s.endAt ? Math.max(0, (s.endAt - Date.now()) / 1000) : s.left;
  },

  mount(el) {
    this.el = el;
    this.load();
    el.innerHTML = `
      <h2>⏱️ Timer <button class="btn small" id="bigBtn" style="margin-left:auto">⛶ Big</button></h2>
      <svg viewBox="-160 -160 320 320" aria-label="Visual timer">
        <circle r="152" fill="#fff" stroke="#000" stroke-width="5"/>
        <g id="ring"></g>
        <circle r="106" fill="#f0f0f0" stroke="#000" stroke-width="3"/>
        <g id="wedges"></g>
        <g id="ticks"></g>
        <rect x="-16" y="-16" width="32" height="32" fill="#7d7d7d" stroke="#000" stroke-width="4"/><rect x="-6" y="-6" width="12" height="12" fill="#fff"/>
      </svg>
      <div class="readout" id="readout"></div>
      <div class="zone" id="zone"></div>
      <div class="presets">${PRESETS.map((m) => `<button class="btn gold preset" data-m="${m}">${m}</button>`).join("")}</div>
      <div class="controls">
        <button class="btn green go" id="goBtn">▶ START</button>
        <button class="btn" id="resetBtn">↺ RESET</button>
      </div>`;

    // Clock face: minute ticks and 5-minute numbers, with a faint colored zone ring outside.
    const ticks = el.querySelector("#ticks"), ring = el.querySelector("#ring");
    let t = "", r = "";
    for (let m = 0; m < 60; m++) {
      const five = m % 5 === 0;
      const [x1, y1] = pt(five ? 104 : 108, m), [x2, y2] = pt(118, m);
      t += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#000" stroke-width="${five ? 4 : 1.5}"/>`;
      if (five) { const [x, y] = pt(134, m); t += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="12" font-family="Press Start 2P, monospace" fill="#000">${m}</text>`; }
    }
    ZONES.forEach((z, i) => { r += `<path d="${arc(146, i * 10, i * 10 + 10)}" fill="none" stroke="${z.color}" stroke-width="8" opacity=".5"/>`; });
    ticks.innerHTML = t; ring.innerHTML = r;

    el.querySelectorAll(".preset").forEach((b) => b.onclick = () => this.set(+b.dataset.m));
    el.querySelector("#goBtn").onclick = () => this.toggle();
    el.querySelector("#resetBtn").onclick = () => this.set(this.state.total / 60);
    el.querySelector("#bigBtn").onclick = () => {
      el.classList.toggle("big");
      el.querySelector("#bigBtn").textContent = el.classList.contains("big") ? "✕ Close" : "⛶ Big";
    };
    this.draw();
    setInterval(() => this.draw(), 250);
  },

  set(min) {
    this.state = { total: min * 60, endAt: null, left: min * 60 };
    this.finishedShown = false;
    this.save(); this.draw();
  },

  toggle() {
    const s = this.state;
    unlockAudio();
    if (s.endAt) { s.left = this.remaining(); s.endAt = null; }
    else {
      if (s.left <= 0) s.left = s.total;
      s.endAt = Date.now() + s.left * 1000;
      this.finishedShown = false;
    }
    this.save(); this.draw();
  },

  draw() {
    if (!this.el) return;
    const s = this.state, left = this.remaining(), mins = left / 60;
    const running = !!s.endAt && left > 0;

    let w = "";
    for (let i = 0; i < ZONES.length; i++) {
      const a = i * 10, b = Math.min(i * 10 + 10, mins);
      if (b > a) w += `<path d="${wedge(104, a, b)}" fill="${ZONES[i].color}"/>`;
    }
    this.el.querySelector("#wedges").innerHTML = w;

    const secs = Math.ceil(left);
    this.el.querySelector("#readout").textContent = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}`;
    const zone = ZONES[Math.min(5, Math.floor(Math.max(0, mins - 0.0001) / 10))];
    const zoneEl = this.el.querySelector("#zone");
    if (left <= 0 && s.endAt) zoneEl.textContent = "⏰ TIME'S UP!";
    else if (running) { zoneEl.textContent = `${zone.name.toUpperCase()} ZONE`; zoneEl.style.color = zone.color; }
    else { zoneEl.textContent = left < s.total ? "PAUSED" : "READY?"; zoneEl.style.color = ""; }

    const go = this.el.querySelector("#goBtn");
    go.textContent = running ? "❚❚ PAUSE" : left < s.total && left > 0 ? "▶ GO ON" : "▶ START";
    go.classList.toggle("green", !running); go.classList.toggle("red", running);
    this.el.querySelectorAll(".preset").forEach((b) => b.classList.toggle("active", +b.dataset.m * 60 === s.total));
    this.el.classList.toggle("finished", left <= 0 && !!s.endAt);

    if (left <= 0 && s.endAt && !this.finishedShown) { this.finishedShown = true; chime(); }
  },
};

// Angle 0 is the top of the face; minutes go clockwise like a real visual timer.
function pt(r, m) {
  const a = (m / 60) * 2 * Math.PI;
  return [+(r * Math.sin(a)).toFixed(2), +(-r * Math.cos(a)).toFixed(2)];
}
function arc(r, a, b) {
  const [x1, y1] = pt(r, a), [x2, y2] = pt(r, b);
  return `M${x1},${y1} A${r},${r} 0 ${b - a > 30 ? 1 : 0} 1 ${x2},${y2}`;
}
function wedge(r, a, b) { return `M0,0 L${arc(r, a, b).slice(1)} Z`; }

/* ---------- Doodle pad ---------- */
const PEN_COLORS = ["#000000", "#ef4444", "#f97316", "#eab308", "#22c55e", "#3b82f6", "#a855f7", "#ec4899", "#8b5a2b"];
const STAMPS = ["⭐", "❤️", "💖", "😊", "😎", "🚗", "🚀", "🌸", "🌈", "💎", "🐶", "🐱", "🍕", "⚽"];
const SIZES = [4, 10, 24];

const Doodle = {
  color: "#000000", size: 10, mode: "pen", stamp: "⭐", hue: 0, undo: [],

  key() { return "doodle-" + kidId; },

  mount(el) {
    el.innerHTML = `
      <h2>🎨 Doodle Pad
        <button class="btn small" id="dUndo" style="margin-left:auto">↶ UNDO</button>
        <button class="btn small" id="dSave">💾 SAVE</button>
        <button class="btn small red" id="dClear">🗑 CLEAR</button></h2>
      <canvas width="900" height="560"></canvas>
      <div class="dtools">
        <div class="grp">${PEN_COLORS.map((c) => `<button class="sw" style="background:${c}" data-c="${c}" title="Color"></button>`).join("")}
          <button class="sw rainbow" data-c="rainbow" title="Rainbow pen"></button></div>
        <div class="grp">${SIZES.map((s) => `<button class="tool" data-size="${s}" title="Brush size"><span class="dot" style="width:${Math.min(s, 22)}px;height:${Math.min(s, 22)}px"></span></button>`).join("")}
          <button class="tool" data-mode="eraser" title="Eraser">🧽</button></div>
      </div>
      <div class="dtools stamps"><div class="grp">${STAMPS.map((s) => `<button class="tool" data-stamp="${s}" title="Stamp">${s}</button>`).join("")}</div></div>`;
    this.canvas = el.querySelector("canvas");
    this.ctx = this.canvas.getContext("2d");
    this.blank();
    try {
      const saved = localStorage.getItem(this.key());
      if (saved) { const img = new Image(); img.onload = () => this.ctx.drawImage(img, 0, 0); img.src = saved; }
    } catch {}

    el.querySelectorAll(".sw").forEach((b) => b.onclick = () => { this.mode = b.dataset.c === "rainbow" ? "rainbow" : "pen"; this.color = b.dataset.c; this.sync(); });
    // Brush sizes also set how big stamps are.
    el.querySelectorAll("[data-size]").forEach((b) => b.onclick = () => { this.size = +b.dataset.size; this.sync(); });
    el.querySelector("[data-mode=eraser]").onclick = () => { this.mode = "eraser"; this.sync(); };
    el.querySelectorAll("[data-stamp]").forEach((b) => b.onclick = () => { this.mode = "stamp"; this.stamp = b.dataset.stamp; this.sync(); });
    el.querySelector("#dUndo").onclick = () => { const last = this.undo.pop(); if (last) { this.ctx.putImageData(last, 0, 0); this.store(); } };
    el.querySelector("#dClear").onclick = () => { if (confirm("Clear your whole drawing?")) { this.snapshot(); this.blank(); this.store(); } };
    el.querySelector("#dSave").onclick = () => {
      const a = document.createElement("a");
      a.href = this.canvas.toDataURL("image/png");
      a.download = `doodle-${ymd(new Date())}.png`;
      a.click();
    };

    const c = this.canvas;
    let last = null;
    const pos = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
    c.onpointerdown = (e) => {
      c.setPointerCapture(e.pointerId);
      this.snapshot();
      const p = pos(e);
      if (this.mode === "stamp") { this.drawStamp(p); this.store(); return; }
      last = p; this.line(p, p);
    };
    c.onpointermove = (e) => { if (!last) return; const p = pos(e); this.line(last, p); last = p; };
    c.onpointerup = c.onpointercancel = () => { if (last) { last = null; this.store(); } };
    this.sync();
  },

  sync() {
    const el = this.canvas.closest(".doodle");
    el.querySelectorAll(".sw").forEach((b) => b.classList.toggle("on", (this.mode === "pen" && b.dataset.c === this.color) || (this.mode === "rainbow" && b.dataset.c === "rainbow")));
    el.querySelectorAll("[data-size]").forEach((b) => b.classList.toggle("on", +b.dataset.size === this.size));
    el.querySelector("[data-mode=eraser]").classList.toggle("on", this.mode === "eraser");
    el.querySelectorAll("[data-stamp]").forEach((b) => b.classList.toggle("on", this.mode === "stamp" && b.dataset.stamp === this.stamp));
  },

  line([x1, y1], [x2, y2]) {
    const ctx = this.ctx;
    ctx.lineCap = ctx.lineJoin = "round";
    ctx.lineWidth = this.mode === "eraser" ? this.size * 2.5 : this.size;
    if (this.mode === "rainbow") { this.hue = (this.hue + 4) % 360; ctx.strokeStyle = `hsl(${this.hue} 90% 55%)`; }
    else ctx.strokeStyle = this.mode === "eraser" ? "#ffffff" : this.color;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2 + 0.01, y2); ctx.stroke();
  },

  drawStamp([x, y]) {
    const ctx = this.ctx;
    ctx.font = `${this.size * 4 + 24}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(this.stamp, x, y);
  },

  blank() { this.ctx.fillStyle = "#fff"; this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height); },
  snapshot() { this.undo.push(this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height)); if (this.undo.length > 15) this.undo.shift(); },
  store() { try { localStorage.setItem(this.key(), this.canvas.toDataURL("image/png")); } catch {} },
};

/* ---------- Zen garden ---------- */
// Rake grooves into the sand around a few rocks. The rocks sit on their own layer so the rake passes "under" them.
const TINE_GAP = 14;
// Little drawings of each tool: a stick, rakes with 3 and 5 teeth, and ripple rings.
const rakeIcon = (xs) => `<svg viewBox="0 0 28 28" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
  <path d="M14 2V12M${xs[0]} 12H${xs[xs.length - 1]}${xs.map((x) => `M${x} 12V23`).join("")}"/></svg>`;
const RAKES = [
  [1, "Stick", `<svg viewBox="0 0 28 28" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 23L21 5"/><circle cx="6" cy="23" r="1.5" fill="currentColor"/></svg>`],
  [3, "Rake", rakeIcon([7, 14, 21])],
  [5, "Wide rake", rakeIcon([3, 8.5, 14, 19.5, 25])],
  ["ripple", "Ripples", `<svg viewBox="0 0 28 28" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="14" cy="14" r="2.5" fill="currentColor"/><circle cx="14" cy="14" r="7"/><circle cx="14" cy="14" r="11.5"/></svg>`],
];

const Zen = {
  rake: 3, undo: [], rocks: null,

  key() { return "zen-" + kidId; },
  rockKey() { return "zenrocks-" + kidId; },

  mount(el) {
    el.innerHTML = `
      <h2>🪨 Zen Garden
        <button class="btn small" id="zUndo" style="margin-left:auto">↶ UNDO</button>
        <button class="btn small" id="zSmooth">🌊 SMOOTH</button></h2>
      <div class="zenbox"><canvas class="sand" width="900" height="560"></canvas><canvas class="rocks" width="900" height="560"></canvas></div>
      <div class="dtools">
        <div class="grp">${RAKES.map(([n, label, icon]) => `<button class="tool rake" data-rake="${n}" title="${label}" aria-label="${label}">${icon}</button>`).join("")}</div>
        <div class="grp"><button class="tool" id="zRocks" title="Put the rocks somewhere new">🪨 NEW ROCKS</button></div>
      </div>`;
    this.canvas = el.querySelector("canvas.sand");
    this.ctx = this.canvas.getContext("2d");
    this.rockCtx = el.querySelector("canvas.rocks").getContext("2d");
    try { this.rocks = JSON.parse(localStorage.getItem(this.rockKey())); } catch {}
    if (!Array.isArray(this.rocks)) this.newRocks();
    this.drawRocks();
    let saved = null;
    try { saved = localStorage.getItem(this.key()); } catch {}
    if (saved) { const img = new Image(); img.onload = () => this.ctx.drawImage(img, 0, 0); img.src = saved; }
    else this.smooth();

    el.querySelectorAll("[data-rake]").forEach((b) => b.onclick = () => { this.rake = b.dataset.rake === "ripple" ? "ripple" : +b.dataset.rake; this.sync(el); });
    el.querySelector("#zUndo").onclick = () => { const last = this.undo.pop(); if (last) { this.ctx.putImageData(last, 0, 0); this.store(); } };
    el.querySelector("#zSmooth").onclick = () => { this.snapshot(); this.smooth(); this.store(); };
    el.querySelector("#zRocks").onclick = () => { this.undo = []; this.newRocks(); this.drawRocks(); this.smooth(); this.store(); };

    const c = this.canvas;
    let last = null, prev = null;
    const pos = (e) => { const r = c.getBoundingClientRect(); return [(e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height]; };
    c.onpointerdown = (e) => {
      c.setPointerCapture(e.pointerId);
      this.snapshot();
      const p = pos(e);
      if (this.rake === "ripple") { this.rings(p, [18, 32, 46, 60]); this.store(); return; }
      last = p; prev = null;
    };
    c.onpointermove = (e) => {
      if (!last) return;
      const p = pos(e), dx = p[0] - last[0], dy = p[1] - last[1], d = Math.hypot(dx, dy);
      if (d < 5) return;
      // Each tine sits side by side, across the direction the rake is moving.
      const nx = -dy / d, ny = dx / d;
      const offs = Array.from({ length: this.rake }, (_, i) => (i - (this.rake - 1) / 2) * TINE_GAP);
      const at = (q) => offs.map((o) => [q[0] + nx * o, q[1] + ny * o]);
      const from = prev || at(last), to = at(p);
      this.groove((ctx, s) => from.forEach((f, i) => { ctx.moveTo(f[0] + s, f[1] + s); ctx.lineTo(to[i][0] + s, to[i][1] + s); }));
      prev = to; last = p;
    };
    c.onpointerup = c.onpointercancel = () => { if (last) { last = null; this.store(); } };
    this.sync(el);
  },

  sync(el) { el.querySelectorAll("[data-rake]").forEach((b) => b.classList.toggle("on", String(this.rake) === b.dataset.rake)); },

  // A groove is a shadowed line with a light edge next to it, so it looks pressed into the sand.
  groove(path) {
    const ctx = this.ctx;
    ctx.lineCap = ctx.lineJoin = "round";
    ctx.beginPath(); path(ctx, 0); ctx.strokeStyle = "rgba(140, 110, 66, .55)"; ctx.lineWidth = 3.4; ctx.stroke();
    ctx.beginPath(); path(ctx, -1.4); ctx.strokeStyle = "rgba(255, 250, 236, .85)"; ctx.lineWidth = 1.5; ctx.stroke();
  },

  rings([x, y], radii) { this.groove((ctx, s) => radii.forEach((r) => { ctx.moveTo(x + s + r, y + s); ctx.arc(x + s, y + s, r, 0, Math.PI * 2); })); },

  // Fresh sand with a little grain, then rings raked around each rock.
  smooth() {
    const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
    ctx.fillStyle = "#e9dbb8"; ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 14000; i++) {
      ctx.fillStyle = Math.random() < .5 ? "rgba(255, 255, 255, .35)" : "rgba(120, 95, 55, .16)";
      ctx.fillRect(Math.random() * w, Math.random() * h, 1.6, 1.6);
    }
    for (const r of this.rocks) this.rings([r.x, r.y], [r.r + 14, r.r + 28, r.r + 42]);
  },

  newRocks() {
    const rocks = [];
    for (let tries = 0; rocks.length < 3 && tries < 200; tries++) {
      const r = 26 + Math.random() * 24, x = 110 + Math.random() * 680, y = 100 + Math.random() * 360;
      if (rocks.some((o) => Math.hypot(o.x - x, o.y - y) < o.r + r + 120)) continue;
      const pts = Array.from({ length: 9 }, () => .8 + Math.random() * .3);
      rocks.push({ x, y, r, pts, moss: Math.random() < .6 });
    }
    this.rocks = rocks;
    safeSet(this.rockKey(), JSON.stringify(rocks));
  },

  drawRocks() {
    const ctx = this.rockCtx;
    ctx.clearRect(0, 0, 900, 560);
    for (const { x, y, r, pts, moss } of this.rocks) {
      const shape = () => {
        ctx.beginPath();
        const p = pts.map((k, i) => { const a = (i / pts.length) * Math.PI * 2; return [x + Math.cos(a) * r * k, y + Math.sin(a) * r * k * .78]; });
        p.forEach((q, i) => { const n = p[(i + 1) % p.length], mx = (q[0] + n[0]) / 2, my = (q[1] + n[1]) / 2; i ? ctx.quadraticCurveTo(q[0], q[1], mx, my) : ctx.moveTo(mx, my); });
        ctx.quadraticCurveTo(p[0][0], p[0][1], (p[0][0] + p[1][0]) / 2, (p[0][1] + p[1][1]) / 2);
        ctx.closePath();
      };
      ctx.save();
      ctx.shadowColor = "rgba(70, 50, 20, .45)"; ctx.shadowBlur = 14; ctx.shadowOffsetX = 6; ctx.shadowOffsetY = 8;
      const g = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r * 1.1);
      g.addColorStop(0, "#b8b6ad"); g.addColorStop(.6, "#7d7b72"); g.addColorStop(1, "#4f4d46");
      shape(); ctx.fillStyle = g; ctx.fill();
      ctx.restore();
      if (moss) { ctx.fillStyle = "rgba(104, 136, 60, .75)"; ctx.beginPath(); ctx.ellipse(x - r * .25, y - r * .35, r * .35, r * .18, -.3, 0, Math.PI * 2); ctx.fill(); }
    }
  },

  snapshot() { this.undo.push(this.ctx.getImageData(0, 0, this.canvas.width, this.canvas.height)); if (this.undo.length > 15) this.undo.shift(); },
  // JPEG keeps the grainy sand small enough for the browser's storage.
  store() { try { localStorage.setItem(this.key(), this.canvas.toDataURL("image/jpeg", .85)); } catch {} },
};

/* ---------- Sound ---------- */
let audio;
function unlockAudio() { try { audio = audio || new AudioContext(); audio.resume(); } catch {} }
function chime() {
  if (!audio) return;
  const notes = [[523, 0, .12], [659, .12, .12], [784, .24, .12], [1046, .36, .12], [784, .5, .1], [1046, .62, .45]];
  for (let rep = 0; rep < 2; rep++) notes.forEach(([f, t, d]) => beep(f, rep * 1.4 + t, d));
}
function coin() {
  unlockAudio();
  if (document.documentElement.dataset.theme === "jump") { beep(988, 0, .08); beep(1319, .08, .3); }
  else if (document.documentElement.dataset.theme === "rainbow") { beep(1047, 0, .06); beep(1319, .06, .06); beep(1568, .12, .06); beep(2093, .18, .2); }
  else { beep(392, 0, .05); beep(784, .05, .09); }
}
function beep(freq, t, dur) {
  const o = audio.createOscillator(), g = audio.createGain(), at = audio.currentTime + t;
  o.type = "square"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.12, at);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(audio.destination);
  o.start(at); o.stop(at + dur + .02);
}
