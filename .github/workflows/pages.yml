# Publishes the Kid Start Page demo to GitHub Pages every time main changes.
# The demo runs entirely in the visitor's browser (see kid-start-page/web/demo.js).
name: Publish demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The web pages plus demo-data.json: the server's starter items and the weekly verses.
      - name: Build the demo site
        run: |
          mkdir _site
          cp -r kid-start-page/web/. _site/
          cd kid-start-page
          python -c "import json, server; json.dump(dict(server.DEFAULT_DATA, verses=server.load_verses()), open('../_site/demo-data.json', 'w', encoding='utf-8'), ensure_ascii=False)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
